<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Numberland — Maths Fun for Kids</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192x192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2026-10-12">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="sun">☀️</div>
</div>

<header id="topbar">
  <button id="btn-back" class="icon-btn hidden" aria-label="Back to the games">⬅️</button>
  <div class="logo" id="logo"><img src="img/icon-192x192.png" alt="" class="logo-img">Numberland</div>
  <div class="top-right">
    <div id="star-counter" class="counter" title="Your stars">⭐ <span id="star-count">0</span></div>
    <div id="trophy-counter" class="counter" title="Your trophies">🏆 <span id="trophy-count">0</span></div>
    <button id="btn-settings" class="icon-btn" aria-label="Settings">⚙️</button>
  </div>
</header>

<main id="app">

  <!-- HOME / MODE SELECT -->
  <section id="screen-home" class="screen">
    <h1 class="welcome">Pick a game! 🎮</h1>
    <p class="subtitle">Tap a card to start playing · ages 3–10</p>
    <div id="mode-grid" class="mode-grid"></div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen hidden">
    <div class="game-head">
      <div id="level-badge" class="level-badge">Level 1</div>
      <div id="streak-dots" class="streak-dots"></div>
    </div>

    <div class="question-row">
      <h2 id="question-text" class="question-text"></h2>
      <button id="btn-repeat" class="icon-btn big" aria-label="Hear the question">🔊</button>
    </div>

    <div id="feedback" class="feedback" aria-live="polite"></div>

    <div id="visual" class="visual"></div>
    <div id="options" class="options"></div>
  </section>

  <!-- REWARD -->
  <section id="screen-reward" class="screen hidden">
    <div class="reward-box">
      <div class="reward-trophy">🏆</div>
      <h2 class="reward-title">Amazing!</h2>
      <p class="reward-sub">You earned a trophy!</p>
      <p id="reward-count" class="reward-count"></p>
      <button id="btn-keep-playing" class="big-btn">Keep Playing! 🎉</button>
    </div>
  </section>

</main>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box" role="dialog" aria-label="Settings">
    <h2>Settings ⚙️</h2>
    <button id="btn-sound-toggle" class="settings-btn">🔔 Sound effects: On</button>
    <button id="btn-voice-toggle" class="settings-btn">🗣️ Voice: On</button>
    <button id="btn-reset" class="settings-btn danger">🗑️ Reset Progress</button>
    <button id="btn-settings-close" class="settings-btn close">✖ Close</button>
  </div>
</div>

<script src="js/game.js?v=2026-10-12"></script>
</body>
</html>
