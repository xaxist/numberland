<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Numberland — Maths Fun for Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="sun">☀️</div>
</div>

<header id="topbar">
  <button id="btn-home" class="icon-btn hidden" aria-label="Back to home">🏠</button>
  <div class="logo">🔢 Numberland</div>
  <div class="top-right">
    <div id="star-counter" class="star-counter" title="Your stars">⭐ <span id="star-count">0</span></div>
    <button id="btn-sound" class="icon-btn" aria-label="Toggle sound">🔊</button>
  </div>
</header>

<main id="app">

  <!-- HOME / MODE SELECT -->
  <section id="screen-home" class="screen">
    <h1 class="welcome">Pick a game! 🎮</h1>
    <p class="subtitle">Tap a card to start playing</p>
    <div id="mode-grid" class="mode-grid"></div>
    <div id="trophy-shelf" class="trophy-shelf hidden">
      <span class="trophy-label">Your trophies:</span>
      <span id="trophy-list"></span>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen hidden">
    <div class="game-head">
      <div id="level-badge" class="level-badge">Level 1</div>
      <div id="streak-dots" class="streak-dots"></div>
    </div>

    <div class="question-row">
      <h2 id="question-text" class="question-text"></h2>
      <button id="btn-repeat" class="icon-btn big" aria-label="Hear the question">🔊</button>
    </div>

    <div id="visual" class="visual"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback hidden"></div>
  </section>

  <!-- REWARD -->
  <section id="screen-reward" class="screen hidden">
    <div class="reward-box">
      <div class="reward-trophy">🏆</div>
      <h2 class="reward-title">Amazing!</h2>
      <p class="reward-sub">You earned a trophy!</p>
      <p id="reward-count" class="reward-count"></p>
      <button id="btn-keep-playing" class="big-btn">Keep Playing! 🎉</button>
    </div>
  </section>

</main>

<script src="game.js"></script>
</body>
</html>
